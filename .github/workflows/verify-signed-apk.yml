name: Verify privately signed SpendWatch APK

on:
  push:
    branches:
      - verify-signed-v46
    paths:
      - 'release/v4.6/public-v2-signing-block.b64'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-signed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Obtain exact tested production APK before signing
        uses: actions/download-artifact@v4
        with:
          name: SpendWatch-v4.6-UNSIGNED-DO-NOT-INSTALL
          run-id: 42589994408
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: unsigned
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools and emulator
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
      - name: Reconstruct APK using PUBLIC precomputed v2 signing block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified
          python3 - <<'PY'
          import base64, hashlib, pathlib, struct
          original=pathlib.Path('unsigned/app-release-unsigned.apk').read_bytes()
          signing_block=base64.b64decode(pathlib.Path('release/v4.6/public-v2-signing-block.b64').read_text().strip())
          eocd=original.rfind(b'PK\\x05\\x06')
          assert eocd >= 0
          central=struct.unpack_from('<I',original,eocd+16)[0]
          fixed=bytearray(original[eocd:])
          struct.pack_into('<I',fixed,16,central+len(signing_block))
          signed=original[:central]+signing_block+original[central:eocd]+fixed
          digest=hashlib.sha256(signed).hexdigest()
          assert digest=='ef1a6b203d27eebd2819f4f845a53ce8c862d6188f97e473fc61d340c3b34907', digest
          pathlib.Path('verified/SpendWatch-Local-v4.6.apk').write_bytes(signed)
          print('Signed production APK SHA256:',digest)
          PY
      - name: Verify official Android signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=verified/SpendWatch-Local-v4.6.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee verified/signature.txt
          grep -iq '176b883f7dec3cd16dc94c840de4031a168b5345be3e33a482a7e969333566d8' verified/signature.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee verified/badging.txt
          grep -q "package: name='com.hossam.spendwatch'" verified/badging.txt
          grep -q "versionCode='10'" verified/badging.txt
          grep -q "versionName='4.6.0'" verified/badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | tee verified/permissions.txt
          if grep -q 'android.permission.INTERNET' verified/permissions.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          grep -q 'android.permission.RECEIVE_SMS' verified/permissions.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install and launch signed production release on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r verified/SpendWatch-Local-v4.6.apk
            adb shell am start -W -n com.hossam.spendwatch/.MainActivity
            adb shell pidof com.hossam.spendwatch
            echo 'SIGNED RELEASE INSTALLED AND LAUNCHED'
      - name: Upload verified signed release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpendWatch-v4.6-PERMANENT-SIGNED-VERIFIED
          path: |
            verified/SpendWatch-Local-v4.6.apk
            verified/signature.txt
            verified/badging.txt
            verified/permissions.txt
          if-no-files-found: warn
          retention-days: 90
