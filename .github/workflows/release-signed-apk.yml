name: Build SpendWatch Updateable APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'SpendWatchLocal/**'
      - '.github/workflows/release-signed-apk.yml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK 34
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # GitHub encrypts this single repository secret; it contains the permanent
      # PKCS12 keystore and its strong random password. Nothing is committed.
      - name: Prepare permanent Android signing identity
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.SPENDWATCH_SIGNING_BUNDLE }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, sys
          bundle = os.environ.get("SIGNING_BUNDLE", "")
          if ":" not in bundle:
              print("::error::Missing SPENDWATCH_SIGNING_BUNDLE repository secret. See signing kit instructions.")
              sys.exit(1)
          password, encoded = bundle.split(":", 1)
          if len(password) < 32:
              print("::error::Signing password is malformed")
              sys.exit(1)
          key_bytes = base64.b64decode(encoded, validate=True)
          if len(key_bytes) < 1000:
              print("::error::Signing keystore is incomplete")
              sys.exit(1)
          key_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "spendwatch-permanent-signing.p12"
          key_path.write_bytes(key_bytes)
          key_path.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("SPENDWATCH_KEYSTORE_PATH=" + str(key_path) + "\n")
              f.write("SPENDWATCH_KEYSTORE_PASSWORD=" + password + "\n")
          PY

      - name: Build updateable release APK
        run: gradle -p SpendWatchLocal --stacktrace :app:assembleRelease

      - name: Verify permanent signature, package and privacy
        shell: bash
        run: |
          set -euo pipefail
          APK="SpendWatchLocal/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" > certificate_details.txt
          EXPECTED_FINGERPRINT="176b883f7dec3cd16dc94c840de4031a168b5345be3e33a482a7e969333566d8"
          grep -iq "$EXPECTED_FINGERPRINT" certificate_details.txt || {
            echo "::error::Unexpected signing certificate. STOP: Do not distribute this APK."
            exit 1
          }
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > apk_badging.txt
          grep -q "package: name='com.hossam.spendwatch'" apk_badging.txt
          if "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | grep -q "android.permission.INTERNET"; then
            echo "::error::SpendWatch must remain offline-only."
            exit 1
          fi
          echo "Signature verified against the fixed permanent certificate."
          echo "Updateability requires the previous installed version to use this same certificate."

      - name: Upload permanently signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendWatch-UPDATEABLE-APK
          path: SpendWatchLocal/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Clean up private signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/spendwatch-permanent-signing.p12"
