name: Build SpendWatch Development APK (NOT UPDATEABLE)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'SpendWatchLocal/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 34
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle -p SpendWatchLocal --stacktrace assembleDebug

      - name: Test signed release build using disposable CI-only key (DO NOT distribute)
        shell: bash
        run: |
          set -eu
          keytool -genkeypair -alias spendwatch -keyalg RSA -keysize 2048 -validity 10 \
            -keystore "$RUNNER_TEMP/temporary-ci-key.p12" -storetype PKCS12 \
            -storepass "CI_TEST_ONLY_DO_NOT_DISTRIBUTE_123456" \
            -dname "CN=SpendWatch CI Temporary Test" -noprompt >/dev/null 2>&1
          export SPENDWATCH_KEYSTORE_PATH="$RUNNER_TEMP/temporary-ci-key.p12"
          export SPENDWATCH_KEYSTORE_PASSWORD="CI_TEST_ONLY_DO_NOT_DISTRIBUTE_123456"
          gradle -p SpendWatchLocal --stacktrace :app:assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            SpendWatchLocal/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/temporary-ci-key.p12"
          rm -f SpendWatchLocal/app/build/outputs/apk/release/app-release.apk

      - name: Upload DEVELOPMENT debug APK (NOT UPDATEABLE)
        uses: actions/upload-artifact@v4
        with:
          name: SpendWatch-DEVELOPMENT-DEBUG-NOT-UPDATEABLE
          path: SpendWatchLocal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
